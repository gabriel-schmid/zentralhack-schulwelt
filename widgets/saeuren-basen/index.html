<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Labor Säuren und Basen</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
    <script src="https://storage.googleapis.com/hazu-ch.appspot.com/files/artifacts/AYbnyrL6JhG3xUjfimN8/hazu-api.js"></script>
    <style>
      :root {
        --ink: #1f2a3a;
        --muted: #5b6878;
        --bg: #f6f4fa;
        --card: #ffffff;
        --accent: #6d28d9;
        --accent-soft: #f1eafd;
        --good: #1f8f50;
        --good-soft: #e9f6ee;
        --bad: #c93b3b;
        --bad-soft: #fcecec;
        --line: #e2dcec;
        --glass: #94a3b8;
        --focus: #f59e0b;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100vh;
        overflow: hidden;
        font-family: Lato, sans-serif;
        background: var(--bg);
        color: var(--ink);
      }
      main {
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: clamp(8px, 2.2vw, 16px);
        gap: 6px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      header h1 {
        margin: 0;
        font-size: clamp(17px, 3.4vw, 22px);
        font-weight: 900;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .status {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        font-weight: 700;
        white-space: nowrap;
      }
      .status .gear {
        font-size: 17px;
      }
      .steps {
        display: flex;
        gap: 4px;
      }
      .steps span {
        width: clamp(12px, 3vw, 20px);
        height: 6px;
        border-radius: 3px;
        background: var(--line);
      }
      .steps span.on {
        background: var(--accent);
      }
      .lead {
        margin: 0;
        color: var(--muted);
        font-size: clamp(13px, 2.2vw, 15px);
        line-height: 1.3;
      }
      .lead b {
        color: var(--ink);
      }
      .stage {
        flex: 1;
        min-height: 0;
        overflow-x: hidden;
        overflow-y: auto;
        padding: 2px;
      }
      button {
        font: inherit;
        color: inherit;
      }
      button:focus-visible,
      textarea:focus-visible,
      summary:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 2px;
      }
      .source,
      .note {
        margin: 6px 0 0;
        font-size: 11.5px;
        color: var(--muted);
      }

      /* safety */
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(150px, 46%), 1fr));
        gap: 8px;
      }
      .card {
        background: var(--card);
        border: 2px solid var(--line);
        border-radius: 12px;
        padding: 6px 8px;
        min-height: 54px;
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        font-size: clamp(12.5px, 2.1vw, 14px);
        line-height: 1.2;
        text-align: left;
      }
      .card .ico {
        font-size: 22px;
        line-height: 1;
        flex: none;
      }
      .card .why {
        display: block;
        font-size: 11.5px;
        color: var(--bad);
        margin-top: 2px;
      }
      .card.on {
        border-color: var(--good);
        background: var(--good-soft);
      }
      .card.wrong {
        border-color: var(--bad);
        background: var(--bad-soft);
      }

      /* hypothesis and choices */
      .opts {
        display: grid;
        gap: 8px;
      }
      .opt {
        min-height: 48px;
        padding: 8px 12px;
        border: 2px solid var(--line);
        border-radius: 12px;
        background: var(--card);
        cursor: pointer;
        text-align: left;
        font-size: clamp(13px, 2.3vw, 15px);
      }
      .opt[aria-pressed="true"] {
        border-color: var(--accent);
        background: var(--accent-soft);
        font-weight: 700;
      }

      /* lab */
      .lab {
        display: grid;
        gap: 8px;
        grid-template-columns: minmax(0, 1fr);
        grid-template-areas: "tasks" "bench" "shelf" "model";
      }
      @media (min-width: 620px) {
        .lab {
          grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
          grid-template-areas: "tasks tasks" "bench shelf" "model model";
          align-items: start;
        }
      }
      .tasks {
        grid-area: tasks;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 6px;
      }
      .task {
        min-height: 44px;
        padding: 4px 6px;
        border: 2px solid var(--line);
        border-radius: 10px;
        background: var(--card);
        cursor: pointer;
        font-size: clamp(11.5px, 2vw, 13.5px);
        font-weight: 700;
        line-height: 1.15;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        text-align: center;
      }
      .task[aria-pressed="true"] {
        border-color: var(--accent);
      }
      .task.solved {
        background: var(--good-soft);
        border-color: var(--good);
        color: var(--good);
      }
      .bench {
        grid-area: bench;
        display: grid;
        gap: 6px;
      }
      @media (max-width: 619px) {
        /* keep the beakers in view while the shelf scrolls underneath */
        .bench {
          position: sticky;
          top: -2px;
          z-index: 2;
          background: var(--bg);
          padding: 2px 0 4px;
        }
      }
      .beakers {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
      }
      .bk {
        position: relative;
        background: var(--card);
        border: 2px solid var(--line);
        border-radius: 12px;
        padding: 4px 4px 6px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1px;
        cursor: pointer;
        font-size: clamp(11.5px, 2vw, 13px);
        line-height: 1.2;
        text-align: center;
        min-height: 44px;
      }
      .bk[aria-pressed="true"] {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px var(--accent-soft);
      }
      .bk svg {
        width: clamp(58px, 15vw, 80px);
        height: auto;
        overflow: visible;
      }
      .bk .nm {
        font-weight: 900;
      }
      .bk .ct {
        color: var(--muted);
        font-size: 11.5px;
        min-height: 2.4em;
      }
      .bk .tag {
        font-size: 11px;
        font-weight: 700;
        border-radius: 8px;
        padding: 1px 6px;
      }
      .bk .tag.stir {
        background: #fff4dc;
        color: #8a5a00;
      }
      .bk .tag.ph {
        background: var(--accent-soft);
        color: var(--accent);
      }
      .liq {
        transition: fill 0.8s ease;
      }
      .bub circle {
        fill: #fff;
        opacity: 0;
      }
      .bk.fizz .bub circle {
        animation: bub 1.2s ease-in infinite;
      }
      .bk.fizz .bub circle:nth-child(2) {
        animation-delay: 0.3s;
      }
      .bk.fizz .bub circle:nth-child(3) {
        animation-delay: 0.6s;
      }
      .bk.fizz .bub circle:nth-child(4) {
        animation-delay: 0.9s;
      }
      @keyframes bub {
        0% {
          opacity: 0.9;
          transform: translateY(0);
        }
        100% {
          opacity: 0;
          transform: translateY(-26px);
        }
      }
      .spoon {
        opacity: 0;
        transform-origin: 40px 60px;
      }
      .bk.stirring .spoon {
        animation: stir 0.9s ease-in-out;
      }
      @keyframes stir {
        0%,
        100% {
          opacity: 1;
          transform: rotate(-14deg);
        }
        50% {
          opacity: 1;
          transform: rotate(14deg);
        }
      }
      .tools {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 6px;
      }
      .tool,
      .bottle {
        min-height: 44px;
        padding: 4px;
        border: 2px solid var(--line);
        border-radius: 10px;
        background: var(--card);
        cursor: pointer;
        font-size: clamp(11.5px, 2vw, 13px);
        line-height: 1.15;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        text-align: center;
      }
      .tool .ico {
        font-size: 17px;
        line-height: 1;
      }
      .shelf {
        grid-area: shelf;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(80px, 23%), 1fr));
        gap: 6px;
        background: #ece6f4;
        border-radius: 12px;
        padding: 6px;
      }
      .shelf .lbl {
        grid-column: 1 / -1;
        font-size: 12px;
        font-weight: 700;
        color: var(--muted);
      }
      .bottle svg {
        width: 18px;
        height: 28px;
      }
      .bottle.ind {
        border-color: #b9a2dc;
      }
      .model {
        grid-area: model;
        font-size: 12px;
        color: var(--muted);
        background: var(--card);
        border-radius: 10px;
        padding: 0 10px;
      }
      .model summary {
        min-height: 44px;
        display: flex;
        align-items: center;
        cursor: pointer;
        font-weight: 700;
      }
      .model p {
        margin: 0 0 8px;
        line-height: 1.35;
      }
      .scale {
        height: 12px;
        border-radius: 6px;
        margin: 2px 0 2px;
      }
      .ticks {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        margin-bottom: 8px;
      }

      /* wrap-up */
      .box {
        background: var(--card);
        border-radius: 12px;
        padding: 8px 12px;
        font-size: clamp(13px, 2.2vw, 15px);
        line-height: 1.35;
        margin-bottom: 8px;
      }
      .box p {
        margin: 2px 0;
      }
      .box .ok {
        color: var(--good);
        font-weight: 900;
      }
      .box .no {
        color: var(--bad);
        font-weight: 900;
      }
      .box ul {
        margin: 2px 0;
        padding-left: 18px;
      }
      .reflect label {
        display: block;
        font-weight: 700;
        margin-bottom: 6px;
        font-size: clamp(13.5px, 2.3vw, 15px);
      }
      .reflect textarea {
        width: 100%;
        min-height: 84px;
        border: 2px solid var(--line);
        border-radius: 10px;
        padding: 8px;
        font: inherit;
        resize: vertical;
      }
      .link {
        min-height: 44px;
        border: 0;
        background: none;
        color: var(--accent);
        font-weight: 700;
        cursor: pointer;
        padding: 0 4px;
      }
      .result {
        text-align: center;
        padding-top: 2vh;
      }
      .result .big {
        font-size: clamp(36px, 9vw, 56px);
        font-weight: 900;
        color: var(--accent);
      }
      .result p {
        margin: 6px 0;
      }

      footer {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 46px;
      }
      .msg {
        flex: 1;
        min-width: 0;
        font-size: clamp(12.5px, 2.1vw, 14.5px);
        line-height: 1.25;
      }
      .msg.good {
        color: var(--good);
      }
      .msg.bad {
        color: var(--bad);
      }
      .btn {
        min-height: 44px;
        padding: 0 16px;
        border: 0;
        border-radius: 10px;
        background: var(--accent);
        color: #fff;
        font-weight: 700;
        cursor: pointer;
        flex: none;
      }
      .btn:disabled {
        opacity: 0.4;
        cursor: default;
      }
      @media (prefers-reduced-motion: reduce) {
        .liq {
          transition: none;
        }
        .bk.fizz .bub circle {
          animation: none;
          opacity: 0.8;
        }
        .bk.stirring .spoon {
          animation: none;
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>🧪 Säure-Base-Labor</h1>
        <div class="status">
          <span class="gear" id="gear" hidden aria-label="Schutzbrille und Handschuhe an">🥽🧤</span>
          <span id="score" hidden></span>
          <div class="steps" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
        </div>
      </header>
      <p class="lead" id="lead"></p>
      <section class="stage" id="stage"></section>
      <footer>
        <div class="msg" id="msg" role="status" aria-live="polite"></div>
        <button class="btn" id="next" disabled>Weiter</button>
      </footer>
    </main>

    <script>
      // ------------------------------------------------------------ content
      // Safety start: only goggles and gloves are required before the first drop.
      const GEAR = [
        { id: "brille", ico: "🥽", label: "Schutzbrille", ok: true },
        { id: "handschuhe", ico: "🧤", label: "Handschuhe", ok: true },
        { id: "sonnenbrille", ico: "🕶️", label: "Sonnenbrille statt Schutzbrille", why: "Sie schützt nicht vor Spritzern von der Seite." },
        { id: "probieren", ico: "👅", label: "Probieren, wie es schmeckt", why: "Im Labor probierst du nie etwas, auch nichts aus der Küche." },
        { id: "znueni", ico: "🥨", label: "Znüni neben den Bechern", why: "Essen und Trinken gehören nicht an den Versuchstisch." },
        { id: "riechen", ico: "👃", label: "Direkt am Becher riechen", why: "Nie direkt riechen. Höchstens Luft zufächeln." },
      ];

      const HYPO = [
        { id: "saurer", label: "Es wird noch saurer." },
        { id: "schwaecher", label: "Die Säure wird schwächer, die Lösung geht Richtung neutral.", ok: true },
        { id: "nichts", label: "Es passiert nichts. Die zwei Flüssigkeiten mischen sich nur." },
      ];

      // Simplified chemistry model. Amounts in mol per litre (estimated, not product data):
      // cit = citric acid (treated as one acid group, pKa 3.13), ace = acetic acid (pKa 4.76),
      // soap = soap anion (effective pKa 9), ct = dissolved carbonate (CO2 + bicarbonate),
      // na = sodium ions that balance the bases.
      const LIQ = [
        { id: "zitrone", name: "Zitronensaft", short: "Zitrone", own: "#f2e58f", c: { cit: 0.15 } },
        { id: "essig", name: "Essig", short: "Essig", own: "#f3eddc", c: { ace: 0.07 } },
        { id: "mineral", name: "Mineralwasser mit Kohlensäure", short: "Mineralwasser", own: "#dcecf8", c: { na: 0.008, ct: 0.108 } },
        { id: "wasser", name: "Leitungswasser", short: "Wasser", own: "#e2eff9", c: { na: 0.002, ct: 0.0022 } },
        { id: "natron", name: "Natron-Lösung", short: "Natron", own: "#eef0f2", c: { na: 0.06, ct: 0.06 } },
        { id: "seife", name: "Seifenlauge", short: "Seife", own: "#e3e8ee", c: { na: 0.01, soap: 0.01 } },
      ];
      const LQ = Object.fromEntries(LIQ.map((l) => [l.id, l]));
      const ACIDS = ["zitrone", "essig"];
      const BASES = ["natron", "seife"];
      const KA = { cit: 10 ** -3.13, ace: 10 ** -4.76, soap: 1e-9, k1: 10 ** -6.35, k2: 10 ** -10.33 };
      const STEP_ML = 10;
      const DROPS = 3;
      const MAX_ML = 100;
      const INDICATOR = "#5b2a86";

      // Red-cabbage colour by pH: red ~2, pink 3-4, violet 5-7, blue 8, blue-green/green 9-11, yellow 12+.
      const CABBAGE = [
        [1, "#b5122b"], [2, "#d0213c"], [3, "#e0457b"], [4, "#cf5a9e"], [5, "#a24fa8"], [6, "#8a4fb0"],
        [7, "#7b4fb0"], [8, "#3f6fd0"], [9, "#2a9d8f"], [10, "#35a85a"], [11, "#7cc23e"], [12, "#d8d23a"], [14, "#e8c62a"],
      ];

      const TASKS = [
        { id: "neutral", short: "Neutralisieren", text: "Mach eine saure Lösung neutral: Essig oder Zitronensaft, bis Rotkohlsaft violett zeigt (etwa pH 6 bis 7.5)." },
        { id: "staerkste", short: "Stärkste Säure", text: "Finde die stärkste Säure: Teste mindestens drei Flüssigkeiten einzeln, darunter die stärkste." },
        { id: "gruen", short: "Erzeuge Grün", text: "Erzeuge Grün: Mische oder wähle etwas, bis Rotkohlsaft grün wird." },
      ];

      const MOCK = { context: { displayName: "Testperson", hazuId: null }, createItem: async () => null };

      const $ = (id) => document.getElementById(id);
      const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
      const reduced = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const state = { hazu: MOCK };

      function freshState() {
        Object.assign(state, {
          safety: { worn: new Set(), wrongTries: [] },
          hypo: null,
          beakers: [emptyBeaker(), emptyBeaker()],
          active: 0,
          task: null,
          solved: {},
          pure: new Map(), // liquid id -> pH from a single-liquid test
          obs: null, // what happened when Essig met Natron
          reflection: "",
        });
      }
      function emptyBeaker() {
        return { ml: {}, mol: {}, drops: 0, mixed: true, prevColor: null, measured: null, fizzed: false };
      }

      // ------------------------------------------------------------ model
      const vol = (b) => Object.values(b.ml).reduce((s, v) => s + v, 0);
      const sources = (b) => Object.keys(b.ml).filter((k) => b.ml[k] > 0);

      function phFromConc(c) {
        let lo = 0;
        let hi = 14;
        for (let i = 0; i < 50; i++) {
          const p = (lo + hi) / 2;
          const h = 10 ** -p;
          const plus = h + (c.na || 0);
          const minus =
            1e-14 / h +
            ((c.cit || 0) * KA.cit) / (KA.cit + h) +
            ((c.ace || 0) * KA.ace) / (KA.ace + h) +
            ((c.soap || 0) * KA.soap) / (KA.soap + h) +
            ((c.ct || 0) * (KA.k1 * h + 2 * KA.k1 * KA.k2)) / (h * h + KA.k1 * h + KA.k1 * KA.k2);
          if (plus > minus) lo = p;
          else hi = p;
        }
        return (lo + hi) / 2;
      }
      function ph(b) {
        const v = vol(b) / 1000;
        if (!v) return null;
        return phFromConc(Object.fromEntries(Object.entries(b.mol).map(([k, n]) => [k, n / v])));
      }
      // CO2 made by neutralising bicarbonate leaves as gas; only the fizz of the mineral
      // water and a little dissolved CO2 stay. Returns the mmol of CO2 that escaped.
      function degas(b) {
        let gone = 0;
        for (let i = 0; i < 8; i++) {
          const v = vol(b);
          const h = 10 ** -ph(b);
          const share = (h * h) / (h * h + KA.k1 * h + KA.k1 * KA.k2);
          const dissolved = (b.mol.ct || 0) * share;
          const cap = (0.1 * (b.ml.mineral || 0) + 0.002 * v) / 1000;
          if (dissolved <= cap * 1.0001) break;
          b.mol.ct -= dissolved - cap;
          gone += dissolved - cap;
        }
        return gone * 1000;
      }

      // ------------------------------------------------------------ colour
      const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
      const toHex = (rgb) => "#" + rgb.map((v) => Math.round(v).toString(16).padStart(2, "0")).join("");
      const mixRgb = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
      function cabbage(p) {
        if (p <= CABBAGE[0][0]) return hex(CABBAGE[0][1]);
        for (let i = 1; i < CABBAGE.length; i++) {
          const [p1, c1] = CABBAGE[i];
          if (p <= p1) {
            const [p0, c0] = CABBAGE[i - 1];
            return mixRgb(hex(c0), hex(c1), (p - p0) / (p1 - p0));
          }
        }
        return hex(CABBAGE[CABBAGE.length - 1][1]);
      }
      function colourName(p) {
        if (p < 2.5) return "rot";
        if (p < 4.5) return "pink";
        if (p < 7.5) return "violett";
        if (p < 8.5) return "blau";
        if (p < 9.5) return "blaugrün";
        if (p < 11.5) return "grün";
        return "gelb";
      }
      function beakerColour(b) {
        const v = vol(b);
        if (!v) return null;
        let own = [0, 0, 0];
        for (const id of sources(b)) own = own.map((x, i) => x + hex(LQ[id].own)[i] * (b.ml[id] / v));
        if (!b.drops) return toHex(own);
        const strength = Math.min(1, (b.drops * 15) / v);
        return toHex(mixRgb(own, cabbage(ph(b)), 0.15 + 0.85 * strength));
      }

      // ------------------------------------------------------------ text helpers
      const round = (p) => Math.max(0, Math.min(14, Math.round(p)));
      function contents(b) {
        const parts = sources(b).map((id) => `${b.ml[id]} ml ${LQ[id].name}`);
        if (b.drops) parts.push(`${b.drops} Tropfen Rotkohlsaft`);
        return parts.join(" + ");
      }
      function describe(b) {
        const p = ph(b);
        return `${contents(b)} → pH ca. ${round(p)}${b.drops ? `, ${colourName(p)}` : ""}`;
      }
      const tested = (b) => vol(b) > 0 && b.mixed && (b.drops > 0 || b.measured !== null);

      // ------------------------------------------------------------ chrome
      function setStep(i) {
        document.querySelectorAll(".steps span").forEach((s, k) => s.classList.toggle("on", k <= i));
        $("stage").scrollTop = 0;
      }
      function say(text, kind = "") {
        const m = $("msg");
        m.textContent = text;
        m.className = `msg ${kind}`;
      }
      function nextButton(enabled, onClick, label = "Weiter") {
        const b = $("next");
        b.textContent = label;
        b.disabled = !enabled;
        b.onclick = onClick;
      }
      const lead = (html) => ($("lead").innerHTML = html);
      const solvedCount = () => Object.keys(state.solved).length;
      function showScore() {
        $("score").hidden = false;
        $("score").textContent = `✓ ${solvedCount()}/3`;
        $("score").setAttribute("aria-label", `${solvedCount()} von 3 Aufgaben gelöst`);
      }

      // ------------------------------------------------------------ 1 safety
      function safetyStep() {
        setStep(0);
        $("gear").hidden = true;
        $("score").hidden = true;
        lead("<b>Herr Tesla:</b> «Bevor der erste Tropfen fällt: Was ziehst du an?» Tippe an, was dich schützt.");
        const stage = $("stage");
        stage.innerHTML = `<div class="grid">${GEAR.map(
          (g) => `<button class="card" data-id="${g.id}" aria-pressed="false"><span class="ico" aria-hidden="true">${g.ico}</span><span>${g.label}</span></button>`,
        ).join("")}</div>
          <p class="source">Allgemeine Laborregeln für den Chemieunterricht. Auch Haushaltsstoffe können in die Augen spritzen.</p>`;
        const sf = state.safety;
        stage.querySelectorAll(".card").forEach((b) =>
          b.addEventListener("click", () => {
            const g = GEAR.find((x) => x.id === b.dataset.id);
            if (!g.ok) {
              if (!b.classList.contains("wrong")) {
                b.classList.add("wrong");
                b.lastElementChild.insertAdjacentHTML("beforeend", `<span class="why">${g.why}</span>`);
                sf.wrongTries.push(g.label);
              }
              say(g.why, "bad");
              return;
            }
            sf.worn.has(g.id) ? sf.worn.delete(g.id) : sf.worn.add(g.id);
            b.classList.toggle("on", sf.worn.has(g.id));
            b.setAttribute("aria-pressed", String(sf.worn.has(g.id)));
            const ready = sf.worn.size === 2;
            say(ready ? "Gut geschützt. Jetzt kann nichts ins Auge gehen." : `${g.label} ${sf.worn.has(g.id) ? "an" : "aus"}.`, ready ? "good" : "");
            nextButton(ready, hypoStep);
          }),
        );
        say("Tippe auf die Karten.");
        nextButton(sf.worn.size === 2, hypoStep);
      }

      // ------------------------------------------------------------ 2 hypothesis
      function hypoStep() {
        setStep(1);
        $("gear").hidden = false;
        lead("<b>Herr Tesla:</b> «Erst denken, dann mischen!» Was passiert, wenn du <b>Natron zu Essig</b> gibst?");
        $("stage").innerHTML = `<div class="opts" role="group" aria-label="Vermutung">${HYPO.map(
          (h) => `<button class="opt" data-id="${h.id}" aria-pressed="${state.hypo === h.id}">${h.label}</button>`,
        ).join("")}</div>`;
        $("stage").querySelectorAll(".opt").forEach((b) =>
          b.addEventListener("click", () => {
            state.hypo = b.dataset.id;
            $("stage").querySelectorAll(".opt").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
            say("Notiert. Im Labor kannst du es prüfen.");
            nextButton(true, labStep, "Ins Labor");
          }),
        );
        say("Wähle eine Vermutung.");
        nextButton(!!state.hypo, labStep, "Ins Labor");
      }

      // ------------------------------------------------------------ 3 lab
      function bottleSvg(colour) {
        return `<svg viewBox="0 0 18 28" aria-hidden="true"><rect x="6" y="0" width="6" height="5" rx="1" fill="#8b7aa8"/><path d="M5 5 H13 V9 Q17 11 17 15 V25 Q17 27 15 27 H3 Q1 27 1 25 V15 Q1 11 5 9 Z" fill="${colour}" stroke="#7c6f92" stroke-width="1.2"/></svg>`;
      }
      function beakerSvg(b, i) {
        const v = vol(b);
        const h = (Math.min(v, MAX_ML) / MAX_ML) * 62;
        const y = 92 - h;
        const now = beakerColour(b);
        let fill = now || "none";
        let defs = "";
        if (v && !b.mixed && b.prevColor) {
          defs = `<defs><linearGradient id="g${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${now}"/><stop offset="0.45" stop-color="${now}"/><stop offset="0.75" stop-color="${b.prevColor}"/></linearGradient></defs>`;
          fill = `url(#g${i})`;
        }
        return `<svg viewBox="0 0 80 100" aria-hidden="true">${defs}
          ${v ? `<rect class="liq" x="17" y="${y}" width="46" height="${h}" rx="3" style="fill:${fill}"/>` : ""}
          <g class="bub"><circle cx="30" cy="${y + 8}" r="2"/><circle cx="44" cy="${y + 12}" r="1.6"/><circle cx="52" cy="${y + 6}" r="2.2"/><circle cx="37" cy="${y + 14}" r="1.4"/></g>
          <path d="M11 22 H15 V90 Q15 96 21 96 H59 Q65 96 65 90 V22 H69" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linejoin="round"/>
          <line x1="58" y1="40" x2="64" y2="40" stroke="#94a3b8" stroke-width="1.4"/>
          <line x1="58" y1="61" x2="64" y2="61" stroke="#94a3b8" stroke-width="1.4"/>
          <g class="spoon"><rect x="38.5" y="6" width="3" height="78" rx="1.5" fill="#a0a8b4"/></g>
        </svg>`;
      }

      function labStep() {
        setStep(2);
        showScore();
        lead("<b>Herr Tesla:</b> «Jetzt bist du dran: eingiessen, Rotkohlsaft dazu, Farbe lesen.» Löse die 3 Aufgaben in beliebiger Reihenfolge.");
        $("stage").innerHTML = `<div class="lab">
          <div class="tasks" role="group" aria-label="Aufgaben">${TASKS.map(
            (t) => `<button class="task" data-t="${t.id}" aria-pressed="false"></button>`,
          ).join("")}</div>
          <div class="bench">
            <div class="beakers">${state.beakers.map((_, i) => `<button class="bk" data-b="${i}"></button>`).join("")}</div>
            <div class="tools">
              <button class="tool" data-a="stir"><span class="ico" aria-hidden="true">🥄</span>Umrühren</button>
              <button class="tool" data-a="strip"><span class="ico" aria-hidden="true">📏</span>pH-Streifen</button>
              <button class="tool" data-a="pour"><span class="ico" aria-hidden="true">↪️</span><span class="pourLbl"></span></button>
              <button class="tool" data-a="empty"><span class="ico" aria-hidden="true">🚰</span>Leeren</button>
            </div>
          </div>
          <div class="shelf" role="group" aria-label="Regal">
            <span class="lbl" id="shelfLbl"></span>
            ${LIQ.map((l) => `<button class="bottle" data-l="${l.id}">${bottleSvg(l.own)}<span>${l.short}</span></button>`).join("")}
            <button class="bottle ind" data-l="indikator">${bottleSvg(INDICATOR)}<span>Rotkohlsaft</span></button>
          </div>
          <details class="model"><summary>ⓘ Vereinfachtes Modell und Farbskala</summary>
            <p>Jede Flüssigkeit enthält im Modell eine geschätzte Menge Säure oder Base pro Liter. Beim Mischen rechnet das Labor aus, wie viel sich neutralisiert und wie stark alles verdünnt wird. Daraus folgt der pH auf der Log-Skala. Schwache Säuren und Basen wie Essig, Zitronensaft, Natron und Seife sind stark vereinfacht. Echte Produkte weichen ab.</p>
            <div class="scale" style="background:linear-gradient(90deg,${CABBAGE.map(([p, c]) => `${c} ${(p / 14) * 100}%`).join(",")})" role="img" aria-label="Rotkohl-Farbskala: rot bei pH 2, pink 3 bis 4, violett 5 bis 7, blau 8, grün 9 bis 11, gelb ab 12"></div>
            <div class="ticks"><span>0 sauer</span><span>7 neutral</span><span>14 basisch</span></div>
          </details>
        </div>`;
        const stage = $("stage");
        stage.querySelectorAll(".bk").forEach((el) => el.addEventListener("click", () => selectBeaker(Number(el.dataset.b))));
        stage.querySelectorAll(".tool").forEach((el) => el.addEventListener("click", () => tool(el.dataset.a)));
        stage.querySelectorAll(".bottle").forEach((el) => el.addEventListener("click", () => fromShelf(el.dataset.l)));
        stage.querySelectorAll(".task").forEach((el) =>
          el.addEventListener("click", () => {
            state.task = state.task === el.dataset.t ? null : el.dataset.t;
            const t = TASKS.find((x) => x.id === el.dataset.t);
            const done = state.solved[t.id];
            say(done ? `Gelöst: ${done.expl}` : t.text, done ? "good" : "");
            renderLab();
          }),
        );
        renderLab();
        say("Wähle einen Becher und giess etwas aus dem Regal hinein.");
        nextButton(true, wrapStep, "Auswerten");
      }

      const letter = (i) => "AB"[i];
      function renderLab() {
        const stage = $("stage");
        state.beakers.forEach((b, i) => {
          const el = stage.querySelector(`.bk[data-b="${i}"]`);
          const v = vol(b);
          const tags = [];
          if (v && !b.mixed) tags.push(`<span class="tag stir">ungerührt</span>`);
          if (b.measured !== null) tags.push(`<span class="tag ph">pH ca. ${b.measured}</span>`);
          el.innerHTML = `${beakerSvg(b, i)}<span class="nm">Becher ${letter(i)} · ${v} ml</span>
            <span class="ct">${v ? esc(contents(b).replace(/ ml /g, " ").replace("Tropfen Rotkohlsaft", "Tr. Rotkohl")) : "leer"}</span>${tags.join(" ")}`;
          el.setAttribute("aria-pressed", String(state.active === i));
          el.setAttribute(
            "aria-label",
            `Becher ${letter(i)}${state.active === i ? ", ausgewählt" : ""}: ${v ? contents(b) : "leer"}${v && !b.mixed ? ", ungerührt" : ""}${b.measured !== null ? `, pH ca. ${b.measured}` : ""}`,
          );
        });
        const other = letter(1 - state.active);
        stage.querySelector(".pourLbl").textContent = `In ${other}`;
        stage.querySelector('[data-a="pour"]').setAttribute("aria-label", `Becher ${letter(state.active)} in Becher ${other} giessen`);
        $("shelfLbl").textContent = `Regal: tippen giesst ${STEP_ML} ml in Becher ${letter(state.active)}`;
        stage.querySelectorAll(".bottle").forEach((el) => {
          const l = el.dataset.l;
          el.setAttribute(
            "aria-label",
            l === "indikator" ? `${DROPS} Tropfen Rotkohlsaft in Becher ${letter(state.active)}` : `${STEP_ML} ml ${LQ[l].name} in Becher ${letter(state.active)} giessen`,
          );
        });
        stage.querySelectorAll(".task").forEach((el) => {
          const t = TASKS.find((x) => x.id === el.dataset.t);
          const done = !!state.solved[t.id];
          el.classList.toggle("solved", done);
          el.setAttribute("aria-pressed", String(state.task === t.id));
          el.innerHTML = `${done ? "✓ " : ""}${t.short}`;
          el.setAttribute("aria-label", `Aufgabe ${t.short}${done ? ", gelöst" : ""}`);
        });
        showScore();
      }

      function selectBeaker(i) {
        state.active = i;
        renderLab();
        const b = state.beakers[i];
        say(`Becher ${letter(i)} gewählt${vol(b) ? `: ${contents(b)}` : " (leer)"}.`);
      }

      // Every change to a beaker goes through here: it resets the strip reading,
      // remembers the colour before the change and checks the tasks afterwards.
      function change(b, mutate, keepsMixed) {
        const before = beakerColour(b);
        mutate();
        b.measured = null;
        if (!keepsMixed) {
          b.prevColor = before;
          b.mixed = false;
        }
        const gone = degas(b);
        if (gone > 0.02) b.fizzed = true;
        return gone;
      }

      function fizz(i, gone) {
        if (gone <= 0.02) return false;
        const el = $("stage").querySelector(`.bk[data-b="${i}"]`);
        el.classList.add("fizz");
        setTimeout(() => el.classList.remove("fizz"), reduced() ? 1500 : 2600);
        return true;
      }

      function fromShelf(id) {
        const i = state.active;
        const b = state.beakers[i];
        if (id === "indikator") {
          if (!vol(b)) return say("Giess zuerst eine Flüssigkeit in den Becher.", "bad");
          change(b, () => (b.drops += DROPS), false);
          renderLab();
          say(`${DROPS} Tropfen Rotkohlsaft in Becher ${letter(i)}. Rühr um, damit sich die Farbe verteilt.`);
          return check();
        }
        if (vol(b) + STEP_ML > MAX_ML) return say(`Becher ${letter(i)} ist voll (höchstens ${MAX_ML} ml).`, "bad");
        const l = LQ[id];
        const same = sources(b).every((s) => s === id) && !b.drops;
        const gone = change(
          b,
          () => {
            b.ml[id] = (b.ml[id] || 0) + STEP_ML;
            for (const [k, c] of Object.entries(l.c)) b.mol[k] = (b.mol[k] || 0) + (c * STEP_ML) / 1000;
          },
          same,
        );
        renderLab();
        const bubbled = fizz(i, gone);
        say(
          bubbled
            ? "Es sprudelt! Das Gas ist Kohlenstoffdioxid (CO₂)."
            : `${STEP_ML} ml ${l.name} in Becher ${letter(i)}.${b.mixed ? "" : " Noch umrühren."}`,
          bubbled ? "good" : "",
        );
        check();
      }

      function tool(a) {
        const i = state.active;
        const b = state.beakers[i];
        const el = $("stage").querySelector(`.bk[data-b="${i}"]`);
        if (a === "empty") {
          if (!vol(b)) return say(`Becher ${letter(i)} ist schon leer.`);
          state.beakers[i] = emptyBeaker();
          renderLab();
          return say(`Becher ${letter(i)} ausgeleert und mit Wasser gespült.`);
        }
        if (!vol(b)) return say(`Becher ${letter(i)} ist leer. Giess zuerst etwas aus dem Regal hinein.`, "bad");
        if (a === "stir") {
          b.mixed = true;
          b.prevColor = null;
          renderLab();
          if (!reduced()) {
            const fresh = $("stage").querySelector(`.bk[data-b="${i}"]`);
            fresh.classList.add("stirring");
            setTimeout(() => fresh.classList.remove("stirring"), 950);
          }
          say(b.drops ? `Umgerührt. Welche Farbe siehst du in Becher ${letter(i)}?` : "Umgerührt. Ohne Rotkohlsaft siehst du keinen Farbwechsel.");
          return check();
        }
        if (a === "strip") {
          if (!b.mixed) return say("Erst umrühren, sonst misst du nur eine Stelle.", "bad");
          b.measured = round(ph(b));
          renderLab();
          say(`pH-Streifen in Becher ${letter(i)}: pH ca. ${b.measured}. ${b.measured < 7 ? "Sauer." : b.measured > 7 ? "Basisch." : "Neutral."}`);
          return check();
        }
        if (a === "pour") {
          const j = 1 - i;
          const t = state.beakers[j];
          if (vol(t) + vol(b) > MAX_ML) return say(`Zu viel für Becher ${letter(j)} (höchstens ${MAX_ML} ml). Leere zuerst etwas aus.`, "bad");
          const gone = change(
            t,
            () => {
              for (const [k, v] of Object.entries(b.ml)) t.ml[k] = (t.ml[k] || 0) + v;
              for (const [k, v] of Object.entries(b.mol)) t.mol[k] = (t.mol[k] || 0) + v;
              t.drops += b.drops;
              t.fizzed = t.fizzed || b.fizzed;
            },
            !vol(t) && b.mixed,
          );
          state.beakers[i] = emptyBeaker();
          state.active = j;
          renderLab();
          const bubbled = fizz(j, gone);
          say(bubbled ? `Umgegossen in Becher ${letter(j)}: Es sprudelt! Das Gas ist CO₂.` : `Umgegossen in Becher ${letter(j)}.${t.mixed ? "" : " Noch umrühren."}`, bubbled ? "good" : "");
          return check();
        }
      }

      // Detect solved tasks from the model state.
      function check() {
        const fresh = [];
        state.beakers.forEach((b) => {
          if (!vol(b)) return;
          const src = sources(b);
          const p = ph(b);
          if (b.ml.essig && b.ml.natron) state.obs = { mix: describe(b), ph: p, fizzed: b.fizzed };
          if (!tested(b)) return;
          if (src.length === 1) state.pure.set(src[0], p);
          if (!state.solved.neutral && src.some((s) => ACIDS.includes(s)) && src.some((s) => BASES.includes(s)) && p >= 6 && p <= 7.5) {
            state.solved.neutral = {
              mix: describe(b),
              expl: `Die Base hat die Säure neutralisiert: pH ca. ${round(p)}.${b.fizzed ? " Das Sprudeln war CO₂ aus dem Natron." : ""}`,
            };
            fresh.push("neutral");
          }
          if (!state.solved.gruen && b.drops && p >= 9 && p < 11.5) {
            state.solved.gruen = { mix: describe(b), expl: `Grün heisst basisch, hier pH ca. ${round(p)}.` };
            fresh.push("gruen");
          }
        });
        if (!state.solved.staerkste && state.pure.has("zitrone") && state.pure.size >= 3) {
          const order = [...state.pure.entries()].sort((a, b) => a[1] - b[1]);
          const row = order.map(([id, p]) => `${LQ[id].name} (pH ca. ${round(p)})`).join(" < ");
          state.solved.staerkste = { mix: row, expl: "Zitronensaft ist am sauersten: tiefster pH, Rotkohl wird rot." };
          fresh.push("staerkste");
        }
        if (fresh.length) {
          renderLab();
          const t = TASKS.find((x) => x.id === fresh[0]);
          const all = solvedCount() === 3;
          say(`✓ ${t.short}! ${state.solved[t.id].expl}${t.id === "staerkste" ? ` Deine Reihe: ${state.solved[t.id].mix}.` : ""}${all ? " Alle 3 gelöst: Tippe auf «Auswerten»." : ""}`, "good");
        }
      }

      // ------------------------------------------------------------ 4 wrap-up
      function observationText() {
        const o = state.obs;
        if (!o) return "Du hast Natron und Essig nicht zusammen gemischt.";
        const start = round(phFromConc(LQ.essig.c));
        const parts = [];
        if (o.fizzed) parts.push("Es hat gesprudelt (CO₂).");
        parts.push(`Der pH ging von ca. ${start} (nur Essig) auf ca. ${round(o.ph)}: ${o.mix}.`);
        return parts.join(" ");
      }
      function hypoHit() {
        if (!state.obs) return null;
        return (HYPO.find((h) => h.id === state.hypo)?.ok ?? false) === state.obs.ph > phFromConc(LQ.essig.c) + 0.5;
      }

      function wrapStep() {
        setStep(3);
        lead("<b>Herr Tesla:</b> «Ein Experiment ist erst fertig, wenn du es erklären kannst.»");
        const hy = HYPO.find((h) => h.id === state.hypo);
        const hit = hypoHit();
        const solved = TASKS.filter((t) => state.solved[t.id]);
        $("stage").innerHTML = `<div class="box">
            <p><b>Deine Vermutung:</b> ${esc(hy ? hy.label : "keine")}</p>
            <p><b>Beobachtet:</b> ${esc(observationText())} ${hit === null ? "" : hit ? '<span class="ok">✓ passt</span>' : '<span class="no">✗ passt nicht</span>'}</p>
            <p><b>Aufgaben ${solved.length}/3:</b></p>
            <ul>${TASKS.map((t) => `<li>${esc(t.short)}: ${state.solved[t.id] ? esc(state.solved[t.id].mix) : "offen"}</li>`).join("")}</ul>
            <button class="link" id="back">← Zurück ins Labor</button>
          </div>
          <div class="reflect">
            <label for="refl">Was hat dich überrascht, und woran hast du es an der Farbe erkannt?</label>
            <textarea id="refl" maxlength="500" placeholder="Zum Beispiel: Ich dachte, Natron macht Essig sauer, aber es wurde violett …">${esc(state.reflection)}</textarea>
          </div>`;
        $("back").addEventListener("click", labStep);
        const ta = $("refl");
        ta.addEventListener("input", () => (state.reflection = ta.value));
        say(hit === null ? "Tipp: Misch im Labor Natron zu Essig, dann siehst du es." : "Ein bis zwei Sätze genügen.");
        nextButton(true, resultStep, "Abschliessen und speichern");
      }

      // ------------------------------------------------------------ result
      async function resultStep() {
        const n = solvedCount();
        setStep(3);
        lead("");
        $("stage").innerHTML = `<div class="result">
          <div class="big">${n}/3</div>
          <p><strong>Aufgaben gelöst. Labor abgeschlossen!</strong></p>
          <p>Rotkohlsaft zeigt: sauer rot bis pink, neutral violett, basisch blau bis grün.</p>
          <p id="saveState" style="color:var(--muted);font-size:13px">Speichere …</p></div>`;
        nextButton(false, restart, "Nochmals");
        const saved = await saveResult(n);
        $("saveState").textContent =
          saved === true
            ? "Dein Ergebnis ist gespeichert."
            : saved === "local"
              ? "Lokaler Modus: Ohne Hazu wird nichts gespeichert."
              : "Speichern hat nicht geklappt. Zeig dein Ergebnis Herrn Tesla.";
        say("Danke fürs Experimentieren! Hände waschen nicht vergessen.", "good");
        nextButton(true, restart, "Nochmals");
      }

      function buildResult(n) {
        const h = state.hazu;
        const name = h?.context?.displayName || "Besuch";
        const sf = state.safety;
        const hy = HYPO.find((x) => x.id === state.hypo);
        const hit = hypoHit();
        const worn = GEAR.filter((g) => sf.worn.has(g.id)).map((g) => g.label);
        const list = (a) => (a.length ? a.map(esc).join(", ") : "keine");
        const tasks = TASKS.map(
          (t) => `<li>${esc(t.short)}: ${state.solved[t.id] ? `${esc(state.solved[t.id].mix)}. ${esc(state.solved[t.id].expl)}` : "nicht gelöst"}</li>`,
        ).join("");
        return {
          title: `Labor Säuren und Basen: ${name} · ${n}/3 Aufgaben`,
          description: `<p>Offenes Labor mit Rotkohlsaft bei Herrn Tesla am ${esc(new Date().toLocaleString("de-CH"))}.</p>
<p><strong>Vermutung</strong> (Natron zu Essig): ${esc(hy ? hy.label : "keine")}<br><strong>Beobachtung:</strong> ${esc(observationText())}${hit === null ? "" : hit ? " Vermutung bestätigt." : " Vermutung nicht bestätigt."}</p>
<p><strong>Aufgaben (${n}/3)</strong></p><ul>${tasks}</ul>
<p><strong>Sicherheit</strong><br>Angezogen: ${list(worn)}<br>Falsch gewählt: ${list(sf.wrongTries)}</p>
<p><strong>Reflexion:</strong> ${state.reflection.trim() ? esc(state.reflection.trim()) : "(keine Antwort)"}</p>`,
        };
      }

      // Saves the result as an item in the station's Hazu. Returns true, "local" or false.
      async function saveResult(n) {
        const h = state.hazu;
        const result = buildResult(n);
        window.lastResult = result; // for local testing
        if (h === MOCK || !h?.context?.hazuId || typeof h.createItem !== "function") return "local";
        try {
          // Results stay private: on hazu.app an item without privacy defaults to "public" (readable without login).
          await h.createItem({ parentId: h.context.hazuId, type: "item", title: result.title, description: result.description, privacy: "private" });
          return true;
        } catch (e) {
          console.warn("Result not saved", e);
          return false;
        }
      }

      function restart() {
        freshState();
        safetyStep();
      }

      async function connect() {
        const inHazu = window.parent !== window && typeof HazuAPI !== "undefined"; // the SDK declares a global const, not window.HazuAPI
        if (!inHazu) return MOCK;
        try {
          return await HazuAPI.init();
        } catch (e) {
          console.warn("Bridge unreachable, using mock data", e);
          return MOCK;
        }
      }

      (async () => {
        state.hazu = await connect();
        freshState();
        safetyStep();
      })();
    </script>
  </body>
