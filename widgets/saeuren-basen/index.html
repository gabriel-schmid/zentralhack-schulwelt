<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Säuren und Basen</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
    <script src="https://storage.googleapis.com/hazu-ch.appspot.com/files/artifacts/AYbnyrL6JhG3xUjfimN8/hazu-api.js"></script>
    <style>
      :root {
        --ink: #1f2a3a;
        --muted: #5b6878;
        --bg: #f6f4fa;
        --card: #ffffff;
        --accent: #6d28d9;
        --accent-soft: #f1eafd;
        --good: #1f8f50;
        --bad: #c93b3b;
        --line: #e2dcec;
        --focus: #f59e0b;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100vh;
        overflow: hidden;
        font-family: Lato, sans-serif;
        background: var(--bg);
        color: var(--ink);
      }
      main {
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: clamp(10px, 2.6vw, 20px);
        gap: 8px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      header h1 {
        margin: 0;
        font-size: clamp(18px, 3.6vw, 24px);
        font-weight: 900;
      }
      .steps {
        margin-left: auto;
        display: flex;
        gap: 5px;
      }
      .steps span {
        width: clamp(16px, 4vw, 26px);
        height: 6px;
        border-radius: 3px;
        background: var(--line);
      }
      .steps span.on {
        background: var(--accent);
      }
      .lead {
        margin: 0;
        color: var(--muted);
        font-size: clamp(13px, 2.3vw, 16px);
        line-height: 1.35;
      }
      .lead b {
        color: var(--ink);
      }
      .stage {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 2px;
      }
      button {
        font: inherit;
        color: inherit;
      }
      button:focus-visible,
      textarea:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 2px;
      }

      /* step 1: safety cards */
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(112px, 30%), 1fr));
        gap: 8px;
      }
      .card {
        background: var(--card);
        border: 2px solid var(--line);
        border-radius: 12px;
        padding: 8px 6px;
        min-height: 68px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        cursor: pointer;
        font-size: clamp(12px, 2.1vw, 14px);
        line-height: 1.2;
        text-align: center;
        transition: transform 0.12s, border-color 0.12s;
      }
      .card:hover:not(:disabled) {
        transform: translateY(-2px);
      }
      .card .ico {
        font-size: 24px;
        line-height: 1;
      }
      .card .why {
        font-size: 11.5px;
        color: var(--bad);
      }
      .card[aria-pressed="true"] {
        border-color: var(--accent);
        background: var(--accent-soft);
      }
      .card.right {
        border-color: var(--good);
        background: #e9f6ee;
      }
      .card.wrong {
        border-color: var(--bad);
        background: #fcecec;
      }
      .card:disabled {
        cursor: default;
      }
      .source {
        margin: 8px 0 0;
        font-size: 11.5px;
        color: var(--muted);
      }

      /* step 2: hypotheses */
      .hypo {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 6px 10px;
        align-items: center;
      }
      .hypo .name {
        font-size: clamp(13px, 2.3vw, 15px);
        font-weight: 700;
      }
      .seg {
        display: flex;
        gap: 4px;
      }
      .seg button {
        min-height: 36px;
        min-width: clamp(62px, 13vw, 84px);
        padding: 0 8px;
        border: 2px solid var(--line);
        border-radius: 8px;
        background: var(--card);
        cursor: pointer;
        font-size: clamp(12px, 2.1vw, 14px);
      }
      .seg button[aria-pressed="true"] {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
        font-weight: 700;
      }

      /* step 3: experiment */
      .bench {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }
      @media (min-width: 600px) {
        .bench {
          grid-template-columns: repeat(6, 1fr);
        }
      }
      .beaker {
        background: var(--card);
        border: 2px solid var(--line);
        border-radius: 12px;
        padding: 4px 4px 6px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        cursor: pointer;
        font-size: clamp(11.5px, 2vw, 13px);
        line-height: 1.15;
        text-align: center;
      }
      .beaker:disabled {
        cursor: default;
      }
      .beaker.done {
        border-color: var(--accent);
      }
      .beaker svg {
        width: clamp(42px, 9vw, 58px);
        height: auto;
        overflow: visible;
      }
      .beaker .col {
        font-weight: 700;
        min-height: 1.15em;
      }
      .pip {
        opacity: 0;
        transform: translateY(-14px);
      }
      .drop {
        opacity: 0;
      }
      .liq {
        transition: fill 1.1s ease;
      }
      .beaker.dropping .pip {
        animation: pip 1.6s ease forwards;
      }
      .beaker.dropping .drop {
        animation: drop 0.45s ease-in 0.55s forwards;
      }
      @keyframes pip {
        0% {
          opacity: 0;
          transform: translateY(-14px);
        }
        25%,
        70% {
          opacity: 1;
          transform: translateY(0);
        }
        100% {
          opacity: 0;
          transform: translateY(-14px);
        }
      }
      @keyframes drop {
        0% {
          opacity: 1;
          transform: translateY(0);
        }
        90% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translateY(26px);
        }
      }

      /* step 4: sorting */
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        min-height: 40px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 38px;
        padding: 0 10px 0 6px;
        border: 2px solid var(--line);
        border-radius: 20px;
        background: var(--card);
        cursor: pointer;
        font-size: clamp(12px, 2.1vw, 14px);
      }
      .chip .dot {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        flex: none;
        border: 1px solid rgba(0, 0, 0, 0.15);
      }
      .chip[aria-pressed="true"] {
        border-color: var(--accent);
        background: var(--accent-soft);
      }
      .chip.shake {
        animation: shake 0.35s;
        border-color: var(--bad);
      }
      @keyframes shake {
        25% {
          transform: translateX(-5px);
        }
        75% {
          transform: translateX(5px);
        }
      }
      .zones {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        margin-top: 8px;
      }
      .zone {
        min-height: 110px;
        border: 2px dashed var(--line);
        border-radius: 12px;
        background: var(--card);
        padding: 6px;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 4px;
        cursor: pointer;
        text-align: center;
      }
      .zone .zt {
        font-weight: 900;
        font-size: clamp(13px, 2.3vw, 15px);
      }
      .zone .zh {
        font-size: 11.5px;
        color: var(--muted);
      }
      .zone.ready {
        border-color: var(--accent);
      }
      .zone .placed {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 12px;
        text-align: left;
      }
      .zone .placed .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        flex: none;
      }
      .scale {
        margin-top: 4px;
      }
      .bar {
        position: relative;
        height: 26px;
        border-radius: 13px;
        background: linear-gradient(
          90deg,
          #c81d3a 0%,
          #e0457b 21%,
          #9d4fa6 36%,
          #7b4fb0 50%,
          #3f6fd0 58%,
          #2a9d8f 71%,
          #9ccc3c 85%,
          #e6d43a 100%
        );
      }
      .bar .mk {
        position: absolute;
        top: 50%;
        width: 22px;
        height: 22px;
        margin: -11px 0 0 -11px;
        border-radius: 50%;
        background: #fff;
        border: 2px solid var(--ink);
        font-size: 11px;
        font-weight: 900;
        display: grid;
        place-items: center;
      }
      .ticks {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: var(--muted);
        margin-top: 2px;
      }
      .legend {
        list-style: none;
        padding: 0;
        margin: 8px 0 0;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(170px, 100%), 1fr));
        gap: 4px 12px;
        font-size: clamp(12px, 2.1vw, 14px);
      }
      .legend b {
        display: inline-grid;
        place-items: center;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        border: 2px solid var(--ink);
        font-size: 11px;
        margin-right: 6px;
      }
      .note {
        font-size: 11.5px;
        color: var(--muted);
        margin: 6px 0 0;
      }

      /* step 5: conclusion */
      table.cmp {
        width: 100%;
        border-collapse: collapse;
        font-size: clamp(12px, 2.1vw, 14px);
        background: var(--card);
        border-radius: 10px;
        overflow: hidden;
      }
      .cmp th,
      .cmp td {
        padding: 5px 6px;
        border-bottom: 1px solid var(--line);
        text-align: left;
      }
      .cmp th {
        background: var(--accent-soft);
        font-size: 12px;
      }
      .cmp .dot {
        display: inline-block;
        width: 11px;
        height: 11px;
        border-radius: 50%;
        margin-right: 4px;
        vertical-align: -1px;
      }
      .cmp .ok {
        color: var(--good);
        font-weight: 900;
      }
      .cmp .no {
        color: var(--bad);
        font-weight: 900;
      }
      .reflect label {
        display: block;
        font-weight: 700;
        margin-bottom: 6px;
        font-size: clamp(14px, 2.4vw, 16px);
      }
      .reflect textarea {
        width: 100%;
        min-height: 96px;
        border: 2px solid var(--line);
        border-radius: 10px;
        padding: 8px;
        font: inherit;
        resize: vertical;
      }
      .result {
        text-align: center;
        padding-top: 2vh;
      }
      .result .big {
        font-size: clamp(36px, 9vw, 60px);
        font-weight: 900;
        color: var(--accent);
      }
      .result p {
        margin: 6px 0;
      }

      footer {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 46px;
      }
      .msg {
        flex: 1;
        font-size: clamp(12.5px, 2.2vw, 15px);
        line-height: 1.3;
      }
      .msg.good {
        color: var(--good);
      }
      .msg.bad {
        color: var(--bad);
      }
      .btn {
        min-height: 44px;
        padding: 0 18px;
        border: 0;
        border-radius: 10px;
        background: var(--accent);
        color: #fff;
        font-weight: 700;
        cursor: pointer;
        flex: none;
      }
      .btn:disabled {
        opacity: 0.4;
        cursor: default;
      }
      @media (prefers-reduced-motion: reduce) {
        .beaker.dropping .pip,
        .beaker.dropping .drop {
          animation-duration: 0.01s;
          animation-delay: 0s;
        }
        .liq {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>🧪 Säuren und Basen</h1>
        <div class="steps" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
      </header>
      <p class="lead" id="lead"></p>
      <section class="stage" id="stage"></section>
      <footer>
        <div class="msg" id="msg" role="status" aria-live="polite"></div>
        <button class="btn" id="next" disabled>Weiter</button>
      </footer>
    </main>

    <script>
      // Step 1: safety at the experiment table. `ok` marks the right choices.
      const GEAR = [
        { id: "brille", ico: "🥽", label: "Schutzbrille", ok: true },
        { id: "handschuhe", ico: "🧤", label: "Handschuhe", ok: true },
        { id: "etikett", ico: "🏷️", label: "Becher beschriften", ok: true },
        { id: "haende", ico: "🧼", label: "Danach Hände waschen", ok: true },
        { id: "probieren", ico: "👅", label: "Probieren, wie es schmeckt", ok: false, why: "Im Labor probierst du nie etwas, auch nichts aus der Küche." },
        { id: "sonnenbrille", ico: "🕶️", label: "Sonnenbrille statt Schutzbrille", ok: false, why: "Sie schützt nicht vor Spritzern von der Seite." },
        { id: "znueni", ico: "🥨", label: "Znüni neben den Bechern", ok: false, why: "Essen und Trinken gehören nicht an den Versuchstisch." },
        { id: "riechen", ico: "👃", label: "Direkt am Becher riechen", ok: false, why: "Nie direkt riechen. Höchstens Luft zufächeln." },
      ];

      // Samples. pH values are typical household values (approximate).
      // Red-cabbage colours: red (pH 1-2), pink (3-4), red-violet (5-6),
      // violet (7), blue (8), blue-green/green (9-11), yellow (12+).
      const CATS = {
        sauer: { label: "sauer", hint: "rot bis pink" },
        neutral: { label: "neutral", hint: "violett" },
        basisch: { label: "basisch", hint: "blau bis grün" },
      };
      const SAMPLES = [
        { id: "zitrone", name: "Zitronensaft", ph: 2, cat: "sauer", start: "#f6efb5", color: "#cf1f3c", colName: "rot" },
        { id: "essig", name: "Essig", ph: 3, cat: "sauer", start: "#f4f1e8", color: "#e0457b", colName: "pink" },
        { id: "mineral", name: "Mineralwasser mit Kohlensäure", short: "Mineralwasser", ph: 5, cat: "sauer", alsoOk: "neutral", start: "#e9f4fb", color: "#a2479e", colName: "rotviolett", note: "Die Kohlensäure macht es leicht sauer, fast neutral." },
        { id: "wasser", name: "Leitungswasser", short: "Wasser", ph: 7, cat: "neutral", start: "#e6f2fb", color: "#7b4fb0", colName: "violett" },
        { id: "natron", name: "Natron in Wasser", short: "Natron", ph: 8, cat: "basisch", start: "#f1f1f1", color: "#3f6fd0", colName: "blau" },
        { id: "seife", name: "Seifenlauge", ph: 10, cat: "basisch", start: "#eef0f2", color: "#2a9d8f", colName: "grün" },
      ];

      const MOCK = { context: { displayName: "Testperson", hazuId: null }, createItem: async () => null };

      const $ = (id) => document.getElementById(id);
      const state = { hazu: MOCK, safety: null, hypo: {}, tested: new Set(), reflection: "" };
      const short = (s) => s.short || s.name;
      const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
      const shuffle = (a) => a.map((v) => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map((p) => p[1]);
      const isHit = (s) => state.hypo[s.id] === s.cat || state.hypo[s.id] === s.alsoOk;

      function setStep(i) {
        document.querySelectorAll(".steps span").forEach((s, k) => s.classList.toggle("on", k <= i));
        $("stage").scrollTop = 0;
      }
      function say(text, kind = "") {
        const m = $("msg");
        m.textContent = text;
        m.className = `msg ${kind}`;
      }
      function nextButton(enabled, onClick, label = "Weiter") {
        const b = $("next");
        b.textContent = label;
        b.disabled = !enabled;
        b.onclick = onClick;
      }
      function lead(html) {
        $("lead").innerHTML = html;
      }

      // ---------------------------------------------------------------- step 1
      function safetyStep() {
        setStep(0);
        lead("<b>Herr Tesla:</b> «Bevor wir tropfen: Was gehört zu einem sicheren Versuch?» Wähle alles, was stimmt.");
        const stage = $("stage");
        stage.innerHTML = `<div class="grid">${shuffle(GEAR)
          .map((g) => `<button class="card" data-id="${g.id}" aria-pressed="false"><span class="ico" aria-hidden="true">${g.ico}</span><span>${g.label}</span></button>`)
          .join("")}</div>
          <p class="source">Allgemeine Laborregeln für den Chemieunterricht. Auch Haushaltsstoffe können in die Augen spritzen.</p>`;
        const picked = new Set();
        stage.querySelectorAll(".card").forEach((b) =>
          b.addEventListener("click", () => {
            const id = b.dataset.id;
            picked.has(id) ? picked.delete(id) : picked.add(id);
            b.setAttribute("aria-pressed", String(picked.has(id)));
            nextButton(picked.size > 0, check, "Prüfen");
          }),
        );
        say("Tippe auf die Karten.");
        nextButton(false, check, "Prüfen");

        function check() {
          const wrongPicks = [];
          const missed = [];
          for (const g of GEAR) {
            const b = stage.querySelector(`[data-id="${g.id}"]`);
            const chosen = picked.has(g.id);
            b.disabled = true;
            b.setAttribute("aria-pressed", "false");
            if (chosen === g.ok) {
              if (g.ok) b.classList.add("right");
              continue;
            }
            b.classList.add("wrong");
            const why = chosen ? g.why : "Fehlt noch.";
            b.insertAdjacentHTML("beforeend", `<span class="why">${why}</span>`);
            (chosen ? wrongPicks : missed).push(g.label);
          }
          state.safety = { chosen: GEAR.filter((g) => picked.has(g.id)).map((g) => g.label), wrongPicks, missed };
          if (!wrongPicks.length && !missed.length) say("Perfekt! So kann nichts ins Auge gehen.", "good");
          else say("Lies die roten Hinweise, dann geht es weiter.", "bad");
          nextButton(true, hypoStep);
        }
      }

      // ---------------------------------------------------------------- step 2
      function hypoStep() {
        setStep(1);
        lead("<b>Herr Tesla:</b> «Erst denken, dann tropfen!» Was vermutest du: Ist der Stoff sauer, neutral oder basisch?");
        $("stage").innerHTML = `<div class="hypo">${SAMPLES.map(
          (s) => `<span class="name" id="n-${s.id}">${s.name}</span>
            <div class="seg" role="group" aria-labelledby="n-${s.id}">${Object.keys(CATS)
              .map((c) => `<button data-s="${s.id}" data-c="${c}" aria-pressed="${state.hypo[s.id] === c}">${CATS[c].label}</button>`)
              .join("")}</div>`,
        ).join("")}</div>`;
        const update = () => {
          const n = Object.keys(state.hypo).length;
          say(`${n} von ${SAMPLES.length} Vermutungen`);
          nextButton(n === SAMPLES.length, experimentStep, "Zum Versuch");
        };
        $("stage").querySelectorAll(".seg button").forEach((b) =>
          b.addEventListener("click", () => {
            state.hypo[b.dataset.s] = b.dataset.c;
            b.parentElement.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
            update();
          }),
        );
        update();
      }

      // ---------------------------------------------------------------- step 3
      function beakerSvg(s) {
        return `<svg viewBox="0 0 60 92" aria-hidden="true">
          <g class="pip">
            <rect x="25" y="-6" width="10" height="14" rx="4" fill="#6d28d9"/>
            <path d="M27 8 H33 L31.2 34 H28.8 Z" fill="#eef0f4" stroke="#94a3b8" stroke-width="1.2"/>
            <path d="M28.2 18 H31.8 L31.2 34 H28.8 Z" fill="#6b3fa0"/>
          </g>
          <circle class="drop" cx="30" cy="38" r="2.6" fill="#6b3fa0"/>
          <rect class="liq" x="15.5" y="58" width="29" height="30.5" rx="2" fill="${s.start}"/>
          <path d="M11 40 H14 V86 Q14 90 18 90 H42 Q46 90 46 86 V40 H49" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linejoin="round"/>
          <line x1="40" y1="50" x2="44" y2="50" stroke="#94a3b8" stroke-width="1.5"/>
          <line x1="40" y1="62" x2="44" y2="62" stroke="#94a3b8" stroke-width="1.5"/>
        </svg>`;
      }

      function experimentStep() {
        setStep(2);
        lead("<b>Herr Tesla:</b> «Rotkohlsaft ist ein <b>Indikator</b>: Er wechselt die Farbe. Tippe einen Becher an, dann tropfe ich.»");
        state.tested = new Set();
        $("stage").innerHTML = `<div class="bench">${SAMPLES.map(
          (s) => `<button class="beaker" data-id="${s.id}" aria-label="${s.name}: Rotkohlsaft zugeben">
            ${beakerSvg(s)}<span>${short(s)}</span><span class="col" aria-hidden="true"></span></button>`,
        ).join("")}</div>`;
        let busy = false;
        const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        $("stage").querySelectorAll(".beaker").forEach((b) =>
          b.addEventListener("click", () => {
            const s = SAMPLES.find((x) => x.id === b.dataset.id);
            if (busy || state.tested.has(s.id)) return;
            busy = true;
            b.classList.add("dropping");
            say(`Ein paar Tropfen Rotkohlsaft in: ${s.name} …`);
            setTimeout(() => (b.querySelector(".liq").style.fill = s.color), reduced ? 0 : 900);
            setTimeout(() => {
              b.classList.remove("dropping");
              b.classList.add("done");
              b.disabled = true;
              b.setAttribute("aria-label", `${s.name}: ${s.colName}`);
              b.querySelector(".col").textContent = s.colName;
              b.querySelector(".col").style.color = s.color;
              state.tested.add(s.id);
              busy = false;
              const left = SAMPLES.length - state.tested.size;
              if (left) say(`${s.name} wird ${s.colName}. Noch ${left} Becher.`);
              else {
                say("Alle Becher getestet. Schau dir die Farben gut an!", "good");
                nextButton(true, sortStep);
              }
            }, reduced ? 100 : 1900);
          }),
        );
        say("Tippe auf einen Becher.");
        nextButton(false, sortStep);
      }

      // ---------------------------------------------------------------- step 4
      function sortStep() {
        setStep(3);
        lead("Ordne jede Probe nach ihrer <b>Farbe</b> ein: Tippe zuerst eine Probe an, dann das passende Feld.");
        $("stage").innerHTML = `<div class="chips">${shuffle(SAMPLES)
          .map((s) => `<button class="chip" data-id="${s.id}" aria-pressed="false"><span class="dot" style="background:${s.color}"></span>${short(s)}</button>`)
          .join("")}</div>
          <div class="zones">${Object.keys(CATS)
            .map((c) => `<button class="zone" data-c="${c}" aria-label="${CATS[c].label}, ${CATS[c].hint}"><span class="zt">${CATS[c].label}</span><span class="zh">${CATS[c].hint}</span></button>`)
            .join("")}</div>`;
        let selected = null;
        const placed = new Set();
        const stage = $("stage");
        const zones = stage.querySelectorAll(".zone");
        stage.querySelectorAll(".chip").forEach((chip) =>
          chip.addEventListener("click", () => {
            selected = selected === chip ? null : chip;
            stage.querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-pressed", String(c === selected)));
            zones.forEach((z) => z.classList.toggle("ready", !!selected));
            say(selected ? "Jetzt das passende Feld antippen." : "");
          }),
        );
        zones.forEach((zone) =>
          zone.addEventListener("click", () => {
            if (!selected) {
              say("Tippe zuerst eine Probe oben an.");
              return;
            }
            const s = SAMPLES.find((x) => x.id === selected.dataset.id);
            const c = zone.dataset.c;
            if (c !== s.cat && c !== s.alsoOk) {
              selected.classList.remove("shake");
              void selected.offsetWidth;
              selected.classList.add("shake");
              say(`Schau auf die Farbe: ${s.colName}. ${CATS[s.cat].hint[0].toUpperCase() + CATS[s.cat].hint.slice(1)} bedeutet ${CATS[s.cat].label}.`, "bad");
              return;
            }
            zone.insertAdjacentHTML("beforeend", `<span class="placed"><span class="dot" style="background:${s.color}"></span>${short(s)}</span>`);
            selected.remove();
            selected = null;
            placed.add(s.id);
            zones.forEach((z) => z.classList.remove("ready"));
            say(s.note || `Richtig: ${s.colName} heisst ${CATS[c].label}.`, "good");
            if (placed.size === SAMPLES.length) setTimeout(scaleView, 900);
          }),
        );
        say("Tippe eine Probe an.");
        nextButton(false, conclusionStep);
      }

      function scaleView() {
        lead("<b>Herr Tesla:</b> «Genau so sieht die <b>pH-Skala</b> aus: 7 ist neutral, darunter sauer, darüber basisch.»");
        const sorted = [...SAMPLES].sort((a, b) => a.ph - b.ph);
        $("stage").innerHTML = `<div class="scale">
          <div class="bar" role="img" aria-label="pH-Skala von 0 bis 14 mit den sechs Proben">${sorted
            .map((s, i) => `<span class="mk" style="left:${(s.ph / 14) * 100}%;top:${i % 2 ? 70 : 30}%">${i + 1}</span>`)
            .join("")}</div>
          <div class="ticks"><span>0 sauer</span><span>7 neutral</span><span>14 basisch</span></div>
          <ol class="legend">${sorted
            .map((s, i) => `<li><b style="background:${s.color};color:#fff">${i + 1}</b>${s.name}: pH ca. ${s.ph}</li>`)
            .join("")}</ol>
          <p class="note">Ungefähre Werte. Sie hängen vom Produkt ab.</p></div>`;
        say("Alle Proben sind eingeordnet!", "good");
        nextButton(true, conclusionStep, "Zum Fazit");
      }

      // ---------------------------------------------------------------- step 5
      function conclusionStep() {
        setStep(4);
        const hits = SAMPLES.filter(isHit).length;
        lead(`Deine Vermutungen im Vergleich: <b>${hits} von ${SAMPLES.length}</b> haben gestimmt.`);
        $("stage").innerHTML = `<table class="cmp">
          <thead><tr><th>Stoff</th><th>Vermutung</th><th>Ergebnis</th><th aria-label="Stimmt"></th></tr></thead>
          <tbody>${SAMPLES.map((s) => {
            const hit = isHit(s);
            return `<tr><td>${short(s)}</td><td>${CATS[state.hypo[s.id]].label}</td>
              <td><span class="dot" style="background:${s.color}"></span>${s.alsoOk ? "leicht sauer" : CATS[s.cat].label}</td>
              <td class="${hit ? "ok" : "no"}" aria-label="${hit ? "stimmt" : "stimmt nicht"}">${hit ? "✓" : "✗"}</td></tr>`;
          }).join("")}</tbody></table>`;
        say(hits === SAMPLES.length ? "Alles richtig vermutet. Stark!" : "Abweichungen sind gut: Daraus lernst du am meisten.", hits === SAMPLES.length ? "good" : "");
        nextButton(true, reflectStep);
      }

      function reflectStep() {
        lead("<b>Herr Tesla:</b> «Ein Experiment ist erst fertig, wenn du es erklären kannst.»");
        $("stage").innerHTML = `<div class="reflect">
          <label for="refl">Welches Ergebnis hat dich überrascht, und woran hast du es erkannt?</label>
          <textarea id="refl" maxlength="500" placeholder="Zum Beispiel: Ich dachte, Seifenlauge ist neutral, aber sie wurde grün …">${esc(state.reflection)}</textarea></div>`;
        const ta = $("refl");
        ta.addEventListener("input", () => (state.reflection = ta.value));
        say("Ein bis zwei Sätze genügen.");
        nextButton(true, resultStep, "Speichern");
      }

      // ---------------------------------------------------------------- result
      async function resultStep() {
        const hits = SAMPLES.filter(isHit).length;
        lead("");
        $("stage").innerHTML = `<div class="result">
          <div class="big">${hits}/${SAMPLES.length}</div>
          <p><strong>Vermutungen bestätigt. Versuch abgeschlossen!</strong></p>
          <p>Sauer färbt Rotkohlsaft rot bis pink, neutral violett, basisch blau bis grün.</p>
          <p id="saveState" style="color:var(--muted);font-size:13px">Speichere …</p></div>`;
        nextButton(false, restart, "Nochmals");
        const saved = await saveResult(hits);
        $("saveState").textContent = saved === true
          ? "Dein Ergebnis ist gespeichert."
          : saved === "local"
            ? "Lokaler Modus: Ohne Hazu wird nichts gespeichert."
            : "Speichern hat nicht geklappt. Zeig dein Ergebnis Herrn Tesla.";
        say("Danke fürs Experimentieren! Hände waschen nicht vergessen.", "good");
        nextButton(true, restart, "Nochmals");
      }

      function buildResult(hits) {
        const h = state.hazu;
        const name = h?.context?.displayName || "Besuch";
        const sf = state.safety || { chosen: [], wrongPicks: [], missed: [] };
        const rows = SAMPLES.map(
          (s) => `<tr><td>${esc(s.name)}</td><td>${CATS[state.hypo[s.id]].label}</td><td>${s.alsoOk ? "leicht sauer" : CATS[s.cat].label} (${s.colName}, pH ca. ${s.ph})</td><td>${isHit(s) ? "✓" : "✗"}</td></tr>`,
        ).join("");
        const list = (a) => (a.length ? a.map(esc).join(", ") : "keine");
        return {
          title: `Säuren und Basen: ${name} · ${hits}/${SAMPLES.length} Vermutungen`,
          description: `<p>Experiment mit Rotkohlsaft bei Herrn Tesla am ${new Date().toLocaleString("de-CH")}.</p>
<p><strong>Vermutung und Ergebnis</strong> (${hits} von ${SAMPLES.length} gestimmt)</p>
<table><thead><tr><th>Stoff</th><th>Vermutung</th><th>Ergebnis</th><th></th></tr></thead><tbody>${rows}</tbody></table>
<p><strong>Sicherheit</strong><br>Gewählt: ${list(sf.chosen)}<br>Falsch gewählt: ${list(sf.wrongPicks)}<br>Vergessen: ${list(sf.missed)}</p>
<p><strong>Reflexion:</strong> ${state.reflection.trim() ? esc(state.reflection.trim()) : "(keine Antwort)"}</p>`,
        };
      }

      // Saves the result as an item in the station's Hazu. Returns true, "local" or false.
      async function saveResult(hits) {
        const h = state.hazu;
        const result = buildResult(hits);
        window.lastResult = result; // for local testing
        if (h === MOCK || !h?.context?.hazuId || typeof h.createItem !== "function") return "local";
        try {
          await h.createItem({ parentId: h.context.hazuId, type: "item", ...result });
          return true;
        } catch (e) {
          console.warn("Result not saved", e);
          return false;
        }
      }

      function restart() {
        state.safety = null;
        state.hypo = {};
        state.reflection = "";
        safetyStep();
      }

      async function connect() {
        const inHazu = window.parent !== window && typeof HazuAPI !== "undefined"; // the SDK declares a global const, not window.HazuAPI
        if (!inHazu) return MOCK;
        try {
          return await HazuAPI.init();
        } catch (e) {
          console.warn("Bridge unreachable, using mock data", e);
          return MOCK;
        }
      }

      (async () => {
        state.hazu = await connect();
        safetyStep();
      })();
    </script>
  </body>
</html>
