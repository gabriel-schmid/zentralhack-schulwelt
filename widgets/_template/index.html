<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Station</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://storage.googleapis.com/hazu-ch.appspot.com/files/artifacts/AYbnyrL6JhG3xUjfimN8/hazu-api.js"></script>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100vh;
        overflow: hidden;
        font-family: Lato, sans-serif;
        background: #f7f9fc;
        color: #1f2a3a;
      }
      main {
        box-sizing: border-box;
        height: 100%;
        padding: clamp(12px, 4vw, 32px);
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      h1 {
        margin: 0;
        font-size: clamp(20px, 5vw, 32px);
      }
      button {
        align-self: flex-start;
        min-height: 44px;
        padding: 0 20px;
        border: 0;
        border-radius: 8px;
        background: #3288ef;
        color: #fff;
        font: inherit;
        cursor: pointer;
      }
      #antwort {
        flex: 1;
        overflow: auto;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="titel">Station</h1>
      <p id="hallo"></p>
      <button id="frage">Coach fragen</button>
      <div id="antwort"></div>
    </main>

    <script>
      // Genius configuration ID of the coach (ask Gabriel to fill it in).
      const COACH_CONFIG_ID = "";

      // Mock data for when the file is opened outside Hazu.
      const MOCK = {
        context: { displayName: "Testperson", language: "de", isEditor: true },
        genius: {
          createSession: async () => ({ sessionId: "lokal" }),
          streamMessage: (_id, _msg, { onChunk, onComplete }) => {
            onChunk({ text: "(Lokal: hier antwortet später der KI-Coach.)" });
            onComplete?.({});
            return () => {};
          },
        },
      };

      async function connect() {
        const inHazu = window.parent !== window && typeof HazuAPI !== "undefined"; // the SDK declares a global const, not window.HazuAPI
        if (!inHazu) return MOCK;
        try {
          return await HazuAPI.init();
        } catch (e) {
          console.warn("Bridge unreachable, using mock data", e);
          return MOCK;
        }
      }

      (async () => {
        const hazu = await connect();
        document.getElementById("hallo").textContent =
          `Hallo ${hazu.context.displayName || ""}!`;

        document.getElementById("frage").addEventListener("click", async () => {
          const out = document.getElementById("antwort");
          out.textContent = "";
          const session = await hazu.genius.createSession({
            configId: COACH_CONFIG_ID,
            overrides: { model: "hazu/fast" },
          });
          hazu.genius.streamMessage(
            session.sessionId,
            { parts: [{ type: "text", text: "Wie fange ich mein Projekt an?" }] },
            {
              onChunk: (c) => (out.textContent += c.text || ""),
              onError: (e) => (out.textContent = `Fehler: ${e.message}`),
            },
          );
        });
      })();
    </script>
  </body>
</html>
